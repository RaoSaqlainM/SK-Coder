services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      SK_CODER_PORT: "8787"
      HOST: "0.0.0.0"
      CORS_ORIGINS: ${CORS_ORIGINS}
      STORAGE_ROOT: ${SK_CODER_HOST_DATA_DIR}/storage
      TMPDIR: ${SK_CODER_HOST_DATA_DIR}/tmp
      STORAGE_CAPACITY_GB: "140"
      STORAGE_OFFLOAD_GB: "100"
      STORAGE_TTL_HOURS: "72"
      MAX_UPLOAD_MB: "100"
      MAX_CODE_KB: "512"
      EXECUTION_TIMEOUT_SECONDS: "15"
      TERMINAL_TIMEOUT_SECONDS: "12"
      MAX_REQUESTS_PER_MINUTE: "30"
      ADMIN_TOKEN: ${ADMIN_TOKEN}
    volumes:
      - ${SK_CODER_HOST_DATA_DIR}:${SK_CODER_HOST_DATA_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
