kind = "web"
previewPath = "/"
title = "SK Coder IDE"
version = "1.0.0"
id = "artifacts/sk-coder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22269

[services.development]
run = "pnpm --filter @workspace/sk-coder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sk-coder", "run", "build" ]
publicDir = "artifacts/sk-coder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22269"
BASE_PATH = "/"
